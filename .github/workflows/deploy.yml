name: practice deployment
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: build code
        run: npm run build

      - name: Deploy to Production
        run: echo "Deploying to production server..."